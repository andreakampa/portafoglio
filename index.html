<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafoglio Tracker Pro</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon/favicon-96x96.png">
    <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">
    <link rel="manifest" href="favicon/site.webmanifest">
</head>
<body>

<!-- AUTH SCREENS -->
<div id="login-overlay" class="auth-overlay">
    <div class="auth-box" id="login-box">
        <!-- contenuto iniettato da auth.js -->
    </div>
</div>

<!-- APP SHELL -->
<div id="app" style="display:none;">
    <nav class="navbar">
        <div class="navbar-brand">📈 Tracker Pro</div>
        <div class="navbar-links">
            <a class="nav-link active" data-page="portfolio">💼 Portafoglio</a>
            <a class="nav-link" data-page="settings">⚙️ Impostazioni</a>
        </div>
        <button class="navbar-logout" id="btn-logout" title="Esci">⏻</button>
    </nav>
    <main class="main-content" id="page-container"></main>
</div>

<div id="toast"></div>
<!-- Librerie esterne con impronta (integrity): se il file sul CDN cambiasse, il browser non lo eseguirebbe.
     Impronte calcolate dai pacchetti npm ufficiali; se si cambia versione vanno ricalcolate. -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js" integrity="sha384-fCAW/rDWORTbQXSiB7mOg0QtQ5c+r0f544y6XoKjuVva0nMBlCpNUjiFeG5iMdS3" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
